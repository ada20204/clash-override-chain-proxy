  <g transform="translate(56 194)">
    <text fill="#F6F8FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="54" font-weight="700">Clash 完全覆写脚本</text>
    <text y="48" fill="#B8C6D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23">把订阅、固定出口与内网代理，变成可控的路由策略。</text>

    <g transform="translate(0 94)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700">
