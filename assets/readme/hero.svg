      <rect width="192" height="52" rx="10" fill="#392E1E" stroke="#E2A959" stroke-width="2"/>
      <text x="96" y="33" text-anchor="middle" fill="#FFE0AC" font-size="19" font-weight="700">按服务分流</text>
      <rect x="210" width="192" height="52" rx="10" fill="#1C2932" stroke="#456271" stroke-width="2"/>
