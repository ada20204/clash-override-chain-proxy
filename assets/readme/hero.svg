<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Clash 完全覆写脚本</title>
  <desc id="desc">Clash / Mihomo 分流覆写：订阅与可选出口输入完全覆写.js，生成策略组、规则和 DNS 配置；不包含部署或主机管理功能。</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <rect width="1200" height="420" rx="24" fill="#111820"/>
  <text x="56" y="116" fill="#7FD8FF" font-size="17" font-weight="700" letter-spacing="1.2">MIHOMO / CLASH PARTY / JAVASCRIPT OVERRIDE</text>

  <g transform="translate(56 194)">
    <text fill="#F6F8FB" font-size="54" font-weight="700">Clash 完全覆写脚本</text>
    <text y="48" fill="#B8C6D1" font-size="23">把订阅、固定出口与内网代理，变成可控的路由策略。</text>

    <g transform="translate(0 94)" font-size="16" font-weight="700">
