      <rect x="274" width="138" height="34" rx="17" fill="#452F20"/>
      <text x="343" y="22" text-anchor="middle" fill="#FFD09A">自定义业务组</text>
    </g>
  </g>

  <g transform="translate(730 76)">
    <text fill="#9DB0BE" font-size="15" font-weight="700" letter-spacing="1.1">CONFIGURATION OVERVIEW</text>

    <g transform="translate(0 28)">
      <rect width="156" height="64" rx="10" fill="#192630" stroke="#385162" stroke-width="2"/>
      <text x="78" y="27" text-anchor="middle" fill="#F6F8FB" font-size="20" font-weight="700">配置输入</text>
      <text x="78" y="49" text-anchor="middle" fill="#B8C6D1" font-size="15">订阅 / 可选出口</text>

      <path d="M172 32H196" stroke="#49B9F2" stroke-width="3"/>
      <path d="M188 25L200 32L188 39" fill="none" stroke="#49B9F2" stroke-width="3"/>

      <rect x="212" width="190" height="64" rx="10" fill="#124465" stroke="#66CCFF" stroke-width="2"/>
      <text x="307" y="27" text-anchor="middle" fill="#F6F8FB" font-size="19" font-weight="700">完全覆写.js</text>
      <text x="307" y="49" text-anchor="middle" fill="#B6E7FF" font-size="15">分组 / 规则 / DNS</text>
    </g>

    <path d="M0 122H125M277 122H402" stroke="#385162" stroke-width="2"/>
    <text x="201" y="128" text-anchor="middle" fill="#B8C6D1" font-size="17">生成分流配置</text>

    <g transform="translate(0 148)">
      <rect width="192" height="66" rx="10" fill="#193A31" stroke="#46C98A" stroke-width="2"/>
      <text x="96" y="29" text-anchor="middle" fill="#F6F8FB" font-size="20" font-weight="700">AI Agent</text>
      <text x="96" y="52" text-anchor="middle" fill="#A8DCC1" font-size="16">AI 域名 / 进程</text>

      <rect x="210" width="192" height="66" rx="10" fill="#243244" stroke="#8298AE" stroke-width="2"/>
      <text x="306" y="29" text-anchor="middle" fill="#F6F8FB" font-size="20" font-weight="700">节点选择</text>
      <text x="306" y="52" text-anchor="middle" fill="#BAC9D6" font-size="16">地区 / 订阅 / 出口</text>
