<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">分流策略概览</title>
  <desc id="desc">按用途展示代理服务器保护、局域网与 Tailnet、安全与检测、AI 和 Google 一致性、功能组、国内与兜底。右侧全协议回退仅说明普通出海流量，FCM/mtalk 另有例外。图示不是规则执行顺序，实际命中以生成配置和新连接为准。</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <rect width="1200" height="660" rx="24" fill="#F6F8FB"/>
  <text x="58" y="62" fill="#15202B" font-size="40" font-weight="700">分流策略概览</text>
  <text x="58" y="94" fill="#526474" font-size="20">按用途展示，不代表逐条匹配顺序；默认选择随 location 变化。</text>

  <g transform="translate(58 132)">
    <g>
      <g transform="translate(0 0)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#1C8FF0"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">代理服务器防回环</text><text x="48" y="47" fill="#526474" font-size="18">服务器地址 → DIRECT，避免节点连接再次被代理</text>
      </g>
      <g transform="translate(0 68)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#3F9E77"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">局域网与 Tailnet 保护</text><text x="48" y="47" fill="#526474" font-size="18">私网 / Tailnet 目的地优先于 AI、浏览器进程规则</text>
      </g>
      <g transform="translate(0 136)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#D86F3B"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">安全保护与检测站</text><text x="48" y="47" fill="#526474" font-size="18">检测按用途分流；指定 QUIC / STUN → REJECT</text>
      </g>
      <g transform="translate(0 204)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#1C8FF0"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">AI 与 Google 出口一致性</text><text x="48" y="47" fill="#526474" font-size="18">默认 → AI Agent；YouTube / Play / FCM 保留例外</text>
      </g>
      <g transform="translate(0 272)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#48758D"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">功能组与普通出海</text><text x="48" y="47" fill="#526474" font-size="18">媒体 / GitHub 等按服务分流；普通出海走节点选择或国外</text>
      </g>
      <g transform="translate(0 340)">
        <rect x="20" y="4" width="6" height="42" rx="3" fill="#3F9E77"/>
        <text x="48" y="20" fill="#15202B" font-size="23" font-weight="700">国内业务与最终兜底</text><text x="48" y="47" fill="#526474" font-size="18">GeoSite / GeoIP CN → 国内；MATCH → 兜底</text>
      </g>
    </g>
  </g>

  <g transform="translate(774 142)">
    <rect width="368" height="400" rx="18" fill="#111820"/>
    <text x="28" y="42" fill="#B6E7FF" font-size="15" font-weight="700" letter-spacing="1">OPTIONAL ROUTE</text>
    <text x="28" y="84" fill="#F6F8FB" font-size="27" font-weight="700">全协议回退</text>
    <text x="28" y="116" fill="#C2CFD9" font-size="18">cn 默认开启，overseas 默认关闭</text>
    <text x="28" y="144" fill="#C2CFD9" font-size="18">主要用于节点选择 / 国外的普通流量</text>
    <path d="M28 162H340" stroke="#31404D" stroke-width="2"/>
    <circle cx="46" cy="196" r="8" fill="#7FD8FF"/>
    <text x="68" y="202" fill="#F6F8FB" font-size="21" font-weight="700">TCP / 443</text>
    <text x="68" y="229" fill="#C2CFD9" font-size="18">保留原策略组的选择</text>
    <circle cx="46" cy="270" r="8" fill="#F0B460"/>
    <text x="68" y="276" fill="#F6F8FB" font-size="21" font-weight="700">其他 TCP / UDP</text>
    <text x="68" y="303" fill="#C2CFD9" font-size="18">仅在完整链路支持 UDP 时回退</text>
    <text x="28" y="347" fill="#C2CFD9" font-size="17">无合格候选：不生成回退组</text>
    <text x="28" y="375" fill="#C2CFD9" font-size="17">FCM / mtalk 按显式例外处理</text>
  </g>

  <text x="58" y="592" fill="#526474" font-size="18">规则模式下：分类与优先级由生成规则决定，最终出口由策略组当前选择决定。</text>
  <text x="58" y="623" fill="#526474" font-size="18">全局模式使用 GLOBAL；实际命中请查看新连接，完整选项与特殊规则见正文。</text>
</svg>
