<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">分流策略概览</title>
  <desc id="desc">代理服务器、Tailnet、安全与检测、AI、功能组、国内及兜底的策略概览，不代表逐条规则顺序。</desc>

  <rect width="1200" height="600" rx="24" fill="#F6F8FB"/>
  <text x="58" y="62" fill="#15202B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="40" font-weight="700">分流策略概览</text>
  <text x="58" y="94" fill="#637383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">业务分类保持一致，默认出口随本机位置变化；检测站用于观察各段出口。</text>

  <g transform="translate(58 132)">
    <line x1="28" y1="22" x2="28" y2="402" stroke="#A8B7C3" stroke-width="4"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <g transform="translate(0 0)">
        <circle cx="28" cy="22" r="18" fill="#1C8FF0"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">1</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">代理服务器地址</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DIRECT · 避免下游 Clash 再次代理上游节点</text>
      </g>
      <g transform="translate(0 68)">
        <circle cx="28" cy="22" r="18" fill="#3F9E77"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">2</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">Tailnet 与 MagicDNS</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">100.64.0.0/10 · *.ts.net · DIRECT</text>
      </g>
      <g transform="translate(0 136)">
        <circle cx="28" cy="22" r="18" fill="#D86F3B"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">3</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">安全保护与 IP 检测</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">检测站按用途分流；指定 QUIC / STUN → REJECT</text>
      </g>
      <g transform="translate(0 204)">
        <circle cx="28" cy="22" r="18" fill="#1C8FF0"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">4</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">AI 域名与 AI 进程</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Claude · OpenAI · Gemini · Kiro → AI Agent</text>
      </g>
      <g transform="translate(0 272)">
        <circle cx="28" cy="22" r="18" fill="#785CD7"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">5</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">通用服务与功能组</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">节点选择 / 国外 / 国际媒体 / GitHub / Apple</text>
      </g>
      <g transform="translate(0 340)">
        <circle cx="28" cy="22" r="18" fill="#3F9E77"/><text x="28" y="29" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">6</text>
        <text x="66" y="20" fill="#15202B" font-size="23" font-weight="700">国内业务与最终兜底</text><text x="66" y="45" fill="#637383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">GeoSite / GeoIP CN → 国内；MATCH → 兜底</text>
      </g>
    </g>
  </g>

  <g transform="translate(774 142)">
    <rect width="368" height="330" rx="18" fill="#111820"/>
    <text x="28" y="42" fill="#B6E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1">OPTIONAL ROUTE</text>
    <text x="28" y="84" fill="#F6F8FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="700">全协议回退</text>
    <text x="28" y="116" fill="#AEBECA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">国内默认开启，海外默认关闭。</text>
    <path d="M28 154H340" stroke="#31404D" stroke-width="2"/>
    <circle cx="46" cy="196" r="8" fill="#7FD8FF"/>
    <text x="68" y="202" fill="#F6F8FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">TCP / 443</text>
    <text x="68" y="229" fill="#AEBECA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">保留 节点选择 / 国外</text>
    <circle cx="46" cy="270" r="8" fill="#F0B460"/>
    <text x="68" y="276" fill="#F6F8FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">其他 TCP / UDP</text>
    <text x="68" y="303" fill="#AEBECA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">有合格候选时进入全协议回退</text>
  </g>

  <text x="58" y="562" fill="#637383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">图示不是逐条规则顺序；最终出口由策略组当前选择决定，以新连接的实际命中为准。</text>
</svg>
